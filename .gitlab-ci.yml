# WORLDLINE pipeline. See docs/ARCHITECTURE.md "GitLab integration" and docs/GITLAB_SETUP.md.
#
#   test -> explore -> kernel-verify -> authorize -> release (tags) / pages (default branch)
#
# Kernel jobs (kernel-verify, authorize) are protected by CODEOWNERS and only run on
# protected refs (branches and tags) or merge requests; they are the only jobs that see
# WORLDLINE_KERNEL_KEY. Duo agents may edit test/explore inputs (scenarios/, worldline/
# except evidence/) but never this file's kernel jobs, invariants/, policies/ or
# worldline/evidence/.
#
# Tag pipelines additionally run `release-assets` and `release`: the signed evidence bundle
# and the kernel's authorization are uploaded to the generic package registry and attached
# to the GitLab release, so every release carries its own proof (docs/RELEASES.md).
# Tags must match the protected-tag rule `v*` for the kernel key to be visible.
#
# Security scanning (SAST, secret detection, dependency scanning) lives in
# .gitlab/ci/security.yml; the optional Cloud Run deployment in .gitlab/ci/gcp.yml.

include:
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/gcp.yml
  - local: .gitlab/ci/review.yml
  - local: .gitlab/ci/package.yml
  - local: .gitlab/ci/docs.yml
  - local: .gitlab/ci/ui.yml
    rules:
      - exists:
          - .gitlab/ci/gcp.yml

stages:
  - test
  - explore
  - kernel-verify
  - authorize
  - release
  - pages

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  WORLDLINE_OUT: "experiments/out"
  WORLDLINE_SCENARIO: "scenarios/port_alert.yaml"
  WORLDLINE_CHALLENGE_SCENARIO: "scenarios/convoy_lostlink.yaml"
  WORLDLINE_BUDGET: "200"
  WORLDLINE_SEED: "42"

default:
  interruptible: true

.python:
  image: python:3.12
  before_script:
    - pip install --quiet uv
    - uv sync --extra dev
  cache:
    key:
      files:
        - uv.lock
      prefix: uv
    paths:
      - .cache/uv
      - .cache/pip
      - .venv

# Branch, MR and tag pipelines; no duplicate branch+MR pipelines.
.rules-default:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Kernel jobs: protected refs (where the signing key is visible), MRs targeting the default
# branch, and tags. On an unprotected tag the key is absent and kernel-verify fails loudly,
# which is intended: only protected tags (`v*`) can become releases.
.rules-kernel:
  rules:
    # Merge-request pipelines from unprotected branches cannot see the protected signing key;
    # the kernel still runs for inspection but must not block the merge check on that ref.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      allow_failure: true
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG

test:
  extends: [.python, .rules-default]
  stage: test
  script:
    - uv run pytest -q --junitxml=report.xml
  artifacts:
    when: always
    paths:
      - report.xml        # the kernel reads the file itself; `reports:` alone is not passed downstream
    reports:
      junit: report.xml
    expire_in: 2 weeks

explore:
  extends: [.python, .rules-default]
  stage: explore
  needs: [test]
  script:
    # Explore, minimise, extract the genome, challenge it on a second scenario, write the report.
    - mkdir -p "$WORLDLINE_OUT"
    - uv run worldline explore "$WORLDLINE_SCENARIO" --budget "$WORLDLINE_BUDGET" --seed "$WORLDLINE_SEED" --out "$WORLDLINE_OUT"
    - uv run worldline minimize "$WORLDLINE_OUT/exploration.json" --out "$WORLDLINE_OUT"
    - uv run worldline genome extract "$WORLDLINE_OUT/minimal_schedule.json" --out "$WORLDLINE_OUT/genome.json"
    - uv run worldline genome challenge "$WORLDLINE_OUT/genome.json" "$WORLDLINE_CHALLENGE_SCENARIO" --seed "$WORLDLINE_SEED" --out "$WORLDLINE_OUT/challenge.json"
    - uv run worldline report "$WORLDLINE_OUT" --code-commit "$CI_COMMIT_SHA"
  artifacts:
    paths:
      - experiments/out/
    expire_in: 2 weeks

# ---------------------------------------------------------------------------------------
# KERNEL JOBS. Protected by CODEOWNERS. Do not edit via agents.
# ---------------------------------------------------------------------------------------

kernel-verify:
  extends: [.python, .rules-kernel]
  stage: kernel-verify
  needs: [explore]
  resource_group: worldline-kernel
  interruptible: false
  variables:
    GIT_STRATEGY: clone
  script:
    # Recomputes verdicts from the traces in experiments/out, seals the bundle with the CI-held key,
    # and verifies the result against the committed public key. Fails on any verification finding.
    - test -f policies/kernel_public.pem
    - |
      if [ -z "$WORLDLINE_KERNEL_KEY" ]; then
        echo "WORLDLINE_KERNEL_KEY is not available on this ref; kernel-verify requires a protected ref." >&2
        exit 1
      fi
    - uv run worldline verify "$WORLDLINE_OUT" --signing-key "$WORLDLINE_KERNEL_KEY" --public-key policies/kernel_public.pem --out "$WORLDLINE_OUT/bundle.json"
  artifacts:
    paths:
      - experiments/out/bundle.json
      - experiments/out/
    expire_in: 2 weeks

authorize:
  extends: [.python, .rules-kernel]
  stage: authorize
  needs: [kernel-verify]
  resource_group: worldline-kernel
  interruptible: false
  script:
    # Gate. The kernel reads only the bundle, the policy and the public key. Exit code non-zero on DENIED.
    - uv run worldline authorize "$WORLDLINE_OUT/bundle.json" --policy policies/release.yaml --public-key policies/kernel_public.pem --artifact-digest "$CI_COMMIT_SHA" --out "$WORLDLINE_OUT/authorization.json"
    - |
      python3 - <<'PY'
      import json, sys
      a = json.load(open("experiments/out/authorization.json"))
      print(json.dumps(a, indent=2))
      if a.get("decision") != "AUTHORIZED":
          print("DENIED: release gate failed", file=sys.stderr)
          sys.exit(1)
      PY
  artifacts:
    when: always
    paths:
      - experiments/out/authorization.json
    expire_in: 2 weeks

# ---------------------------------------------------------------------------------------
# Optional: start the WORLDLINE Repair flow from CI when the gate is DENIED.
# Uses the GA Flows API (GitLab 19.5): POST /api/v4/ai/duo_workflows/workflows
# https://docs.gitlab.com/api/duo_agent_platform_flows/
# Needs CI variables WORLDLINE_DUO_TOKEN (project access token, scope api) and
# WORLDLINE_REPAIR_FLOW_CONSUMER_ID (numeric AI Catalog consumer id of the enabled flow).
# Manual by design (Supervised autonomy): a human decides to hand the failure to the Repairer.
# If the group enforces composite identity for API-started flows this returns 403; then
# trigger the flow by mentioning @ai-worldline-repair-<group> in the issue instead.
# ---------------------------------------------------------------------------------------
duo-repair:
  stage: authorize
  image: curlimages/curl:8.10.1
  needs:
    - job: authorize
      artifacts: true
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $WORLDLINE_DUO_TOKEN && $WORLDLINE_REPAIR_FLOW_CONSUMER_ID
  script:
    - |
      GOAL="WORLDLINE release gate DENIED for commit $CI_COMMIT_SHA on $CI_COMMIT_REF_NAME. Read experiments/out/authorization.json in pipeline $CI_PIPELINE_URL, follow AGENTS.md repair contract, and open a merge request that makes the failing branch PASS and adds a regression scenario."
      # GOAL contains no double quotes, so it can be embedded directly.
      printf '{"project_id":"%s","goal":"%s","ai_catalog_item_consumer_id":%s,"source_branch":"%s","allow_agent_to_request_user":false,"start_workflow":true}' \
        "$CI_PROJECT_ID" "$GOAL" "$WORLDLINE_REPAIR_FLOW_CONSUMER_ID" "$CI_COMMIT_REF_NAME" > duo_request.json
      curl --fail-with-body --request POST \
        --header "PRIVATE-TOKEN: $WORLDLINE_DUO_TOKEN" \
        --header "Content-Type: application/json" \
        --data @duo_request.json \
        --url "$CI_API_V4_URL/ai/duo_workflows/workflows"

# ---------------------------------------------------------------------------------------
# PROOF-CARRYING RELEASES (tag pipelines only).
# release-assets: uploads the evidence files to the generic package registry under
#   worldline-evidence/<tag>/ and writes release_notes.md (quoting the authorization decision
#   and the bundle root) plus assets.json (release asset links). Refuses to continue unless
#   the kernel decision is AUTHORIZED.
# release: creates the GitLab release for the tag with those notes and links, using glab
#   (release-cli is deprecated since GitLab 18.0; the `release:` keyword itself runs glab).
# ---------------------------------------------------------------------------------------

release-assets:
  stage: release
  image: python:3.12
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: kernel-verify
      artifacts: true
    - job: authorize
      artifacts: true
  variables:
    GIT_STRATEGY: none
    EVIDENCE_PACKAGE: worldline-evidence
  script:
    - |
      set -eu
      test -f "$WORLDLINE_OUT/bundle.json"
      test -f "$WORLDLINE_OUT/authorization.json"
      BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$EVIDENCE_PACKAGE/$CI_COMMIT_TAG"
      UPLOADED=""
      for f in bundle.json authorization.json genome.json minimal_schedule.json challenge.json benchmark.json index.json; do
        if [ -f "$WORLDLINE_OUT/$f" ]; then
          echo "uploading $f"
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$WORLDLINE_OUT/$f" "$BASE/$f"
          echo
          UPLOADED="$UPLOADED $f"
        else
          echo "skipping $f (not produced by this pipeline)"
        fi
      done
      echo "$UPLOADED" > uploaded.txt
    - |
      python3 - <<'PY'
      import hashlib, json, os
      out = os.environ["WORLDLINE_OUT"]
      tag = os.environ["CI_COMMIT_TAG"]
      sha = os.environ["CI_COMMIT_SHA"]
      path = os.environ["CI_PROJECT_PATH"]
      base = "%s/projects/%s/packages/generic/%s/%s" % (os.environ["CI_API_V4_URL"], os.environ["CI_PROJECT_ID"], os.environ["EVIDENCE_PACKAGE"], tag)
      uploaded = open("uploaded.txt").read().split()
      auth = json.load(open(out + "/authorization.json"))
      bundle = json.load(open(out + "/bundle.json"))
      cp = bundle.get("checkpoint") or {}
      root = cp.get("root", "see bundle.json")
      def sha256(p):
          h = hashlib.sha256()
          with open(p, "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 16), b""):
                  h.update(chunk)
          return h.hexdigest()
      decision = auth.get("decision", "UNKNOWN")
      satisfied = auth.get("satisfied") or []
      missing = auth.get("missing") or []
      met, total = len(satisfied), len(satisfied) + len(missing)
      lines = [
          "## WORLDLINE release " + tag,
          "",
          "- Commit: `%s`" % sha,
          "- Kernel decision: **%s** (%d of %d policy requirements met)" % (decision, met, total),
          "- Artifact digest checked by the kernel: `%s`" % auth.get("artifact_digest", sha),
          "- Evidence bundle root: `%s` (signer %s, sealed %s)" % (root, cp.get("signer_key_id", "?"), cp.get("sealed_at", "?")),
          "- Records in bundle: %d" % len(bundle.get("records", [])),
          "- Pipeline: " + os.environ["CI_PIPELINE_URL"],
          "",
          "### Evidence assets (generic package registry)",
          "",
          "| File | SHA-256 |",
          "|---|---|",
      ]
      links = []
      for f in uploaded:
          lines.append("| [%s](%s/%s) | `%s` |" % (f, base, f, sha256(out + "/" + f)))
          links.append({"name": f, "url": base + "/" + f, "link_type": "other"})
      lines += [
          "",
          "### Verify offline",
          "",
          "```",
          "curl -LO %s/bundle.json" % base,
          "curl -LO https://gitlab.com/%s/-/raw/%s/policies/kernel_public.pem" % (path, tag),
          "curl -LO https://gitlab.com/%s/-/raw/%s/policies/release.yaml" % (path, tag),
          "uv run worldline authorize bundle.json --policy release.yaml --public-key kernel_public.pem --artifact-digest " + sha + " --out authorization.json",
          "```",
          "",
          "The kernel recomputes the decision from the bundle, the policy and the public key alone; see docs/RELEASES.md.",
          "Claim ceiling of this release: whatever the authorization says, nothing more. Agents never attest; the kernel does.",
      ]
      open("release_notes.md", "w", encoding="utf-8").write("\n".join(lines) + "\n")
      json.dump(links, open("assets.json", "w"))
      print("\n".join(lines))
      if decision != "AUTHORIZED":
          raise SystemExit("release gate: kernel decision is not AUTHORIZED; no release is created")
      PY
  artifacts:
    paths:
      - release_notes.md
      - assets.json
    expire_in: 1 year

release:
  stage: release
  image: python:3.12
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release-assets
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    # Create the release through the Releases API with the job token: no git checkout, no extra tooling.
    - |
      python - <<'PY'
      import json, os, urllib.request
      api = os.environ["CI_API_V4_URL"]; pid = os.environ["CI_PROJECT_ID"]; tag = os.environ["CI_COMMIT_TAG"]
      body = {"name": f"WORLDLINE {tag}", "tag_name": tag, "ref": os.environ["CI_COMMIT_SHA"],
              "description": open("release_notes.md", encoding="utf-8").read(),
              "assets": {"links": json.load(open("assets.json", encoding="utf-8"))}}
      req = urllib.request.Request(f"{api}/projects/{pid}/releases", data=json.dumps(body).encode(),
                                   headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"], "Content-Type": "application/json"})
      with urllib.request.urlopen(req) as r:
          out = json.load(r)
      print("release created:", out["name"], out["_links"]["self"])
      PY

pages:
  stage: pages
  image: node:20
  needs:
    - job: explore
      artifacts: true
    - job: docs
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules
  script:
    - cd ui && npm ci && npm run build && cd ..
    - rm -rf public && mkdir -p public/experiments
    - cp -r ui/dist/. public/
    - cp -r experiments/out public/experiments/out
    - mkdir -p public/docs
    - if [ -d public_docs ]; then cp -r public_docs/. public/docs/; fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
