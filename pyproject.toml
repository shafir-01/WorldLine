[project]
name = "worldline"
version = "0.1.0"
description = "Counterfactual computing substrate: branch executions, isolate the causal difference, type the evidence, gate the release."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "shafir-01" }]
dependencies = ["pyyaml>=6.0", "typer>=0.12", "rich>=13.0", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-cov>=5.0"]

[project.scripts]
worldline = "worldline.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
