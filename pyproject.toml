[project]
name = "worldline"
dynamic = ["version"]
description = "Counterfactual computing substrate: branch executions, isolate the causal difference, type the evidence, gate the release."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shafir-01", email = "shafirkhajo@gmail.com" }]
maintainers = [{ name = "shafir-01", email = "shafirkhajo@gmail.com" }]
keywords = [
  "counterfactual", "fault-injection", "simulation", "delta-debugging", "evidence",
  "release-gating", "supply-chain", "ci", "gitlab", "testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["pyyaml>=6.0", "typer>=0.12", "rich>=13.0", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-cov>=5.0"]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.urls]
Homepage = "https://gitlab.com/shafir2/WorldLine"
Repository = "https://gitlab.com/shafir2/WorldLine.git"
Issues = "https://gitlab.com/shafir2/WorldLine/-/issues"
Changelog = "https://gitlab.com/shafir2/WorldLine/-/blob/main/CHANGELOG.md"
Documentation = "https://gitlab.com/shafir2/WorldLine/-/blob/main/docs/INSTALL.md"

[project.scripts]
worldline = "worldline.cli.main:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "worldline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["worldline"]
exclude = ["**/__pycache__", "**/*.pyc"]

# Bundled data: an installed `worldline` finds these through worldline.resources
# (worldline/_data/... inside the wheel). The private kernel key is never packaged.
[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "worldline/_data/scenarios"
"invariants" = "worldline/_data/invariants"
"policies/release.yaml" = "worldline/_data/policies/release.yaml"
"policies/kernel_public.pem" = "worldline/_data/policies/kernel_public.pem"

[tool.hatch.build.targets.sdist]
include = [
  "/worldline",
  "/scenarios",
  "/invariants",
  "/policies/release.yaml",
  "/policies/kernel_public.pem",
  "/tests",
  "/data",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]
exclude = ["**/__pycache__", "**/*.pyc", "/policies/kernel_private.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
